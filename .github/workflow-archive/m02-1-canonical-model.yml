name: M02.1 Canonical Project Document Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - 'tooling/fixtures/canonical-model/**'
      - 'tooling/fixtures/help.architecture.models.json'
      - 'tooling/vitest/unit/canonical-project-document.test.ts'
      - 'tooling/vitest/contract/canonical-project-document-boundary.test.ts'
      - 'tooling/vitest/integration/canonical-project-persistence.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m02-1-canonical-model.yml'
      - '.ai/HELP_ARCHITECTURE_MODELS.md'
  push:
    branches: [main]
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - 'tooling/fixtures/canonical-model/**'
      - 'tooling/fixtures/help.architecture.models.json'
      - 'tooling/vitest/unit/canonical-project-document.test.ts'
      - 'tooling/vitest/contract/canonical-project-document-boundary.test.ts'
      - 'tooling/vitest/integration/canonical-project-persistence.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m02-1-canonical-model.yml'
      - '.ai/STATE.md'
      - '.ai/TRACKING.md'
      - '.ai/HELP_ARCHITECTURE_MODELS.md'

permissions:
  contents: read
  statuses: write

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: M02.1 canonical project/document model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish pending status
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'electrocraft/M02.1',
              description: 'M02.1 canonical project/document model running',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify locked toolchain
        run: |
          test "$(node --version)" = 'v22.16.0'
          test "$(npm --version)" = '10.9.2'
          test "$(npm config get legacy-peer-deps)" = 'true'
          test -f package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Zod boundary owner
        run: |
          node -e "const p=require('./node_modules/zod/package.json'); if(p.version!=='4.4.3') throw new Error('expected zod@4.4.3, got '+p.version); console.log('zod@'+p.version)"

      - name: Execute M02.1 unit contract integration tests
        run: npm run test:m02-1 | tee m02-1-model-tests.log

      - name: Execute full repository pipeline
        run: npm run check | tee m02-1-check.log

      - name: Emit M02.1 closure candidate marker
        run: echo PASS_M02_1_PROJECT_DOCUMENT_MODEL | tee m02-1-closure.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m02-1-canonical-model-evidence
          path: |
            m02-1-model-tests.log
            m02-1-check.log
            m02-1-closure.log
            tooling/fixtures/canonical-model
            tooling/fixtures/help.architecture.models.json

      - name: Publish final commit status
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'electrocraft/M02.1',
              description: 'M02.1 canonical project/document model gate',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
