name: M02.4 Action State Navigation Permission Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - 'packages/workflow-rete/**'
      - 'packages/state-zustand/**'
      - 'packages/auth-core/**'
      - 'tooling/fixtures/canonical-model/**'
      - 'tooling/fixtures/help.architecture.models.json'
      - 'tooling/vitest/unit/action-state-navigation-permission.test.ts'
      - 'tooling/vitest/contract/action-state-navigation-permission-boundary.test.ts'
      - 'tooling/vitest/integration/action-state-navigation-permission-runtime.test.ts'
      - '.ai/HELP_ARCHITECTURE_MODELS.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m02-4-action-state-navigation-permission.yml'
  push:
    branches: [main]
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - 'packages/workflow-rete/**'
      - 'packages/state-zustand/**'
      - 'packages/auth-core/**'
      - 'tooling/fixtures/canonical-model/**'
      - 'tooling/fixtures/help.architecture.models.json'
      - 'tooling/vitest/unit/action-state-navigation-permission.test.ts'
      - 'tooling/vitest/contract/action-state-navigation-permission-boundary.test.ts'
      - 'tooling/vitest/integration/action-state-navigation-permission-runtime.test.ts'
      - '.ai/HELP_ARCHITECTURE_MODELS.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m02-4-action-state-navigation-permission.yml'

permissions:
  contents: read
  statuses: write

defaults:
  run:
    shell: bash

jobs:
  m02-4:
    name: M02.4 action/state/navigation/permission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'electrocraft/M02.4',
              description: 'M02.4 action/state/navigation/permission gate running',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify locked toolchain
        run: |
          test "$(node --version)" = 'v22.16.0'
          test "$(npm --version)" = '10.9.2'
          test "$(npm config get legacy-peer-deps)" = 'true'
          test -f package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify M02.4 engine pins
        run: |
          node -e "const p=require('./node_modules/rete/package.json'); if(p.version!=='2.0.6') throw new Error('expected rete@2.0.6, got '+p.version); console.log('rete@'+p.version)"
          node -e "const p=require('./packages/state-zustand/node_modules/zustand/package.json'); if(p.version!=='5.0.14') throw new Error('expected zustand@5.0.14, got '+p.version); console.log('zustand@'+p.version)"

      - name: Execute M02.4 unit contract integration tests
        run: npm run test:m02-4 | tee m02-4-tests.log

      - name: Execute full repository pipeline
        run: npm run check | tee m02-4-check.log

      - name: Execute accepted real Rete integration
        run: |
          npm ci --prefix experiments/m00-6-action-flow-rete --ignore-scripts --no-audit --no-fund
          npm run verify --prefix experiments/m00-6-action-flow-rete | tee m02-4-rete-integration.log

      - name: Emit M02.4 closure candidate marker
        run: echo PASS_M02_4_ACTION_STATE_NAVIGATION_PERMISSION | tee m02-4-closure.log

      - name: Upload M02.4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: m02-4-action-state-navigation-permission-evidence
          path: |
            m02-4-tests.log
            m02-4-check.log
            m02-4-rete-integration.log
            m02-4-closure.log
            tooling/fixtures/canonical-model/action-graph-v1.json
            tooling/fixtures/canonical-model/state-v1.json
            tooling/fixtures/canonical-model/route-v1.json
            tooling/fixtures/canonical-model/navigation-v1.json
            tooling/fixtures/canonical-model/role-v1.json
            tooling/fixtures/canonical-model/permission-policy-v1.json
            tooling/fixtures/help.architecture.models.json
          if-no-files-found: error

      - name: Publish final commit status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'electrocraft/M02.4',
              description: 'M02.4 action/state/navigation/permission gate',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
