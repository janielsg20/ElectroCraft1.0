name: M02.7 ExportIR Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - 'packages/export-ir/**'
      - 'tooling/fixtures/canonical-model/**'
      - 'tooling/fixtures/help.architecture.models.json'
      - 'tooling/vitest/helpers/export-ir-fixture.ts'
      - 'tooling/vitest/unit/export-ir.test.ts'
      - 'tooling/vitest/contract/export-ir-boundary.test.ts'
      - 'tooling/vitest/integration/export-ir-runtime.test.ts'
      - '.github/workflows/m02-7-export-ir.yml'
  push:
    branches: [main]
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - 'packages/export-ir/**'
      - 'tooling/fixtures/canonical-model/**'
      - 'tooling/fixtures/help.architecture.models.json'
      - 'tooling/vitest/helpers/export-ir-fixture.ts'
      - 'tooling/vitest/unit/export-ir.test.ts'
      - 'tooling/vitest/contract/export-ir-boundary.test.ts'
      - 'tooling/vitest/integration/export-ir-runtime.test.ts'
      - '.github/workflows/m02-7-export-ir.yml'

permissions:
  contents: read
  statuses: write

defaults:
  run:
    shell: bash

jobs:
  m02-7:
    name: M02.7 canonical ExportIR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'electrocraft/M02.7',
              description: 'M02.7 canonical ExportIR gate running',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify locked toolchain
        run: |
          test "$(node --version)" = 'v22.16.0'
          test "$(npm --version)" = '10.9.2'
          test "$(npm config get legacy-peer-deps)" = 'true'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Zod boundary and owner count
        run: |
          node -e "const p=require('./node_modules/zod/package.json'); if(p.version!=='4.4.3') throw new Error('expected zod@4.4.3, got '+p.version); console.log('zod@'+p.version)"
          node -e "const p=require('./tooling/package-boundaries.json'); const expected=p.invariants.expectedStablePackageCount; const actual=Object.keys(p.packages).length; if(actual!==expected) throw new Error('owner package count drift: expected '+expected+', got '+actual); console.log('ownerPackages='+actual)"

      - name: Execute M02.7 unit contract integration tests with generated evidence
        run: |
          mkdir -p .evidence/m02-7
          ELECTROCRAFT_EVIDENCE_DIR=.evidence/m02-7 npm run test:m02-7 | tee m02-7-tests.log

      - name: Execute full repository pipeline
        run: npm run check | tee m02-7-check.log

      - name: Verify generated M02.7 evidence
        run: |
          test -f .evidence/m02-7/m02-7-export-ir-roundtrip.json
          test -f .evidence/m02-7/m02-7-native-compile-input.json
          test -f .evidence/m02-7/m02-7-web-compile-input.json
          test -f .evidence/m02-7/m02-7-validation-report.json
          test -f .evidence/m02-7/m02-7-boundary-report.json
          node -e "const r=require('./.evidence/m02-7/m02-7-export-ir-roundtrip.json'); if(r.targetIds.length!==9) throw new Error('expected nine Core targets'); if(r.schemaVersion!==1) throw new Error('unexpected ExportIR schema'); console.log('exportIrChecksum='+r.checksum)"
          node -e "const n=require('./.evidence/m02-7/m02-7-native-compile-input.json'); const w=require('./.evidence/m02-7/m02-7-web-compile-input.json'); if(n.targetId!=='android-expo'||w.targetId!=='react-web') throw new Error('target compile fixture drift'); if(n.exportIrChecksum!==w.exportIrChecksum) throw new Error('targets did not receive same IR revision'); console.log('sharedRevision='+n.exportIrChecksum)"
          node -e "const r=require('./.evidence/m02-7/m02-7-validation-report.json'); if(r.status!=='blocked'||!r.diagnostics.some((d)=>d.code==='MISSING_PROJECT_REF')) throw new Error('validation report did not fail closed'); console.log('validationBlocked=true')"
          node -e "const r=require('./.evidence/m02-7/m02-7-boundary-report.json'); if(r.targetSpecificInternalsInIr!==false) throw new Error('target-specific internals entered IR'); console.log('targetSpecificInternalsInIr=false')"

      - name: Emit M02.7 closure candidate marker
        run: echo PASS_M02_7_CANONICAL_EXPORT_IR | tee m02-7-closure.log

      - name: Upload M02.7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: m02-7-canonical-export-ir-evidence
          path: |
            m02-7-tests.log
            m02-7-check.log
            m02-7-closure.log
            .evidence/m02-7/*.json
            tooling/fixtures/canonical-model/export-ir-media-manifest-v1.json
            tooling/fixtures/canonical-model/export-ir-native-compile-context-v1.json
          if-no-files-found: error

      - name: Publish final commit status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'electrocraft/M02.7',
              description: 'M02.7 canonical ExportIR gate',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
