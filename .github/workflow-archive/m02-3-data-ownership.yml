name: M02.3 Data Query Form Ownership Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - 'packages/data-core/**'
      - 'packages/query-rqb/**'
      - 'packages/forms/**'
      - 'tooling/fixtures/canonical-model/**'
      - 'tooling/vitest/unit/data-query-form-ownership.test.ts'
      - 'tooling/vitest/contract/data-query-form-boundary.test.ts'
      - 'tooling/vitest/integration/data-query-form-runtime.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m02-3-data-ownership.yml'
  push:
    branches: [main]
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - 'packages/data-core/**'
      - 'packages/query-rqb/**'
      - 'packages/forms/**'
      - 'tooling/fixtures/canonical-model/**'
      - 'tooling/vitest/unit/data-query-form-ownership.test.ts'
      - 'tooling/vitest/contract/data-query-form-boundary.test.ts'
      - 'tooling/vitest/integration/data-query-form-runtime.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m02-3-data-ownership.yml'
      - '.ai/STATE.md'
      - '.ai/TRACKING.md'

permissions:
  contents: read
  statuses: write

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: M02.3 data/query/form ownership
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Publish pending status
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'electrocraft/M02.3',
              description: 'M02.3 data/query/form ownership gate running',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify locked toolchain
        run: |
          test "$(node --version)" = 'v22.16.0'
          test "$(npm --version)" = '10.9.2'
          test "$(npm config get legacy-peer-deps)" = 'true'
          test -f package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify M02.3 engine pins
        run: |
          node -e "const p=require('./node_modules/zod/package.json'); if(p.version!=='4.4.3') throw new Error('expected zod@4.4.3, got '+p.version); console.log('zod@'+p.version)"
          node -e "const p=require('./node_modules/@react-querybuilder/core/package.json'); if(p.version!=='8.23.0') throw new Error('expected @react-querybuilder/core@8.23.0, got '+p.version); console.log('@react-querybuilder/core@'+p.version)"

      - name: Execute M02.3 unit contract integration tests
        run: npm run test:m02-3 | tee m02-3-tests.log

      - name: Execute full repository pipeline
        run: npm run check | tee m02-3-check.log

      - name: Execute accepted M00.5 RQB plus PGlite storage integration
        run: |
          npm ci --prefix experiments/m00-5-query-portable --ignore-scripts --no-audit --no-fund
          npm run verify --prefix experiments/m00-5-query-portable | tee m02-3-storage-query-integration.log

      - name: Emit M02.3 closure candidate marker
        run: echo PASS_M02_3_DATA_QUERY_FORM_OWNERSHIP | tee m02-3-closure.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m02-3-data-query-form-evidence
          path: |
            m02-3-tests.log
            m02-3-check.log
            m02-3-storage-query-integration.log
            m02-3-closure.log
            tooling/fixtures/canonical-model/project-v2.json
            tooling/fixtures/canonical-model/data-source-v1.json
            tooling/fixtures/canonical-model/data-schema-v1.json
            tooling/fixtures/canonical-model/query-v1.json
            tooling/fixtures/canonical-model/form-v2.json

      - name: Publish final commit status
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'electrocraft/M02.3',
              description: 'M02.3 data/query/form ownership gate',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
