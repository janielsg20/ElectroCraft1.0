name: M02.8 Model Ownership Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - '.ai/MODEL_OWNERSHIP.md'
      - 'tooling/fixtures/help.architecture.models.json'
      - 'tooling/vitest/unit/model-ownership.test.ts'
      - 'tooling/vitest/contract/model-ownership-boundary.test.ts'
      - 'tooling/vitest/integration/model-ownership-runtime.test.ts'
      - 'package.json'
      - '.github/workflows/m02-8-model-ownership.yml'
  push:
    branches: [main]
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - '.ai/MODEL_OWNERSHIP.md'
      - 'tooling/fixtures/help.architecture.models.json'
      - 'tooling/vitest/unit/model-ownership.test.ts'
      - 'tooling/vitest/contract/model-ownership-boundary.test.ts'
      - 'tooling/vitest/integration/model-ownership-runtime.test.ts'
      - 'package.json'
      - '.github/workflows/m02-8-model-ownership.yml'

permissions:
  contents: read
  statuses: write

defaults:
  run:
    shell: bash

jobs:
  m02-8:
    name: M02.8 model ownership architecture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'electrocraft/M02.8',
              description: 'M02.8 model ownership gate running',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify locked toolchain
        run: |
          test "$(node --version)" = 'v22.16.0'
          test "$(npm --version)" = '10.9.2'
          test "$(npm config get legacy-peer-deps)" = 'true'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify canonical owner boundary
        run: |
          node -e "const p=require('./node_modules/zod/package.json'); if(p.version!=='4.4.3') throw new Error('expected zod@4.4.3, got '+p.version); console.log('zod@'+p.version)"
          node -e "const p=require('./tooling/package-boundaries.json'); const expected=p.invariants.expectedStablePackageCount; const actual=Object.keys(p.packages).length; if(actual!==expected) throw new Error('owner package count drift: expected '+expected+', got '+actual); console.log('ownerPackages='+actual)"
          test -f .ai/MODEL_OWNERSHIP.md

      - name: Execute M02.8 ownership tests with generated evidence
        run: |
          mkdir -p .evidence/m02-8
          ELECTROCRAFT_EVIDENCE_DIR=.evidence/m02-8 npm run test:m02-8 | tee m02-8-tests.log

      - name: Execute full repository pipeline
        run: npm run check | tee m02-8-check.log

      - name: Verify generated M02.8 evidence
        run: |
          test -f .evidence/m02-8/m02-8-ownership-report.json
          test -f .evidence/m02-8/m02-8-export-boundary.json
          node -e "const r=require('./.evidence/m02-8/m02-8-ownership-report.json'); if(r.status!=='ready') throw new Error('ownership report blocked'); if(r.descriptorCount!==26) throw new Error('expected 26 ownership descriptors'); if(r.counts['project-object']!==14||r.counts['registry-definition']!==6||r.counts['content-entity']!==6) throw new Error('ownership category count drift'); console.log('ownership=14/6/6')"
          node -e "const r=require('./.evidence/m02-8/m02-8-export-boundary.json'); if(r.fullRegistrySerialized!==false||r.contentCollectionsSerializedInProject!==false) throw new Error('ownership boundary leaked into project/IR'); console.log('registryLeak=false contentLeak=false')"
          grep -q 'Project Objects' .ai/MODEL_OWNERSHIP.md
          grep -q 'Application Registries' .ai/MODEL_OWNERSHIP.md
          grep -q 'Content / Runtime Entities' .ai/MODEL_OWNERSHIP.md

      - name: Emit M02.8 closure candidate marker
        run: echo PASS_M02_8_MODEL_OWNERSHIP | tee m02-8-closure.log

      - name: Upload M02.8 evidence
        uses: actions/upload-artifact@v4
        with:
          name: m02-8-model-ownership-evidence
          path: |
            m02-8-tests.log
            m02-8-check.log
            m02-8-closure.log
            .evidence/m02-8/*.json
            .ai/MODEL_OWNERSHIP.md
            tooling/fixtures/help.architecture.models.json
          if-no-files-found: error

      - name: Publish final commit status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'electrocraft/M02.8',
              description: 'M02.8 model ownership gate',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
