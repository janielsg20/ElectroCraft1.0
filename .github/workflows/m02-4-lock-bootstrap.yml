name: M02.4 Lockfile Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - agent/m02-4-action-state-navigation-permission
    paths:
      - 'packages/workflow-rete/package.json'
      - 'packages/state-zustand/package.json'
      - 'package.json'
      - '.github/workflows/m02-4-lock-bootstrap.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/workflow-rete/package.json'
      - 'packages/state-zustand/package.json'
      - 'package.json'
      - '.github/workflows/m02-4-lock-bootstrap.yml'

permissions:
  contents: write
  statuses: write

defaults:
  run:
    shell: bash

jobs:
  lockfile:
    name: Generate reproducible root lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'electrocraft/M02.4-lock',
              description: 'M02.4 lockfile bootstrap running',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Checkout feature branch for push bootstrap
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          ref: agent/m02-4-action-state-navigation-permission

      - name: Checkout validation ref
        if: github.event_name != 'push'
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify toolchain
        run: |
          test "$(node --version)" = 'v22.16.0'
          test "$(npm --version)" = '10.9.2'
          test "$(npm config get legacy-peer-deps)" = 'true'

      - name: Generate locked dependency graph
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      - name: Verify requested engine pins
        run: |
          node -e "const p=require('./package-lock.json'); const w=p.packages['packages/workflow-rete']; const s=p.packages['packages/state-zustand']; if(w.dependencies.rete!=='2.0.6') throw new Error('rete pin missing'); if(s.dependencies.zustand!=='5.0.14') throw new Error('zustand pin missing');"
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/rete']?.version!=='2.0.6') throw new Error('rete@2.0.6 not locked'); const nested=p.packages['packages/state-zustand/node_modules/zustand']; if(nested?.version!=='5.0.14' && p.packages['node_modules/zustand']?.version!=='5.0.14') throw new Error('zustand@5.0.14 not locked');"

      - name: Commit generated lockfile to feature branch
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update M02.4 workspace lockfile"
          git push origin HEAD:agent/m02-4-action-state-navigation-permission

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: m02-4-root-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'electrocraft/M02.4-lock',
              description: 'M02.4 lockfile bootstrap',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
