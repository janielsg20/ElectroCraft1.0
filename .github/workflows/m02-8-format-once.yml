name: M02.8 Format Once

on:
  push:
    branches:
      - agent/m02-8-model-ownership
    paths:
      - '.github/workflows/m02-8-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m02-8-model-ownership
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format M02.8 files
        run: |
          npx prettier --write \
            packages/domain/src/contracts/model-ownership.ts \
            packages/application/src/model-ownership-service.ts \
            tooling/vitest/integration/model-ownership-runtime.test.ts \
            tooling/vitest/unit/model-ownership.test.ts \
            tooling/fixtures/canonical-model/model-ownership-v1.json
          git rm .github/workflows/m02-8-format-once.yml
      - name: Commit formatting and remove helper
        run: |
          git config user.name electrocraft-ci
          git config user.email 72001897+janielsg20@users.noreply.github.com
          git add packages/domain/src/contracts/model-ownership.ts packages/application/src/model-ownership-service.ts tooling/vitest/integration/model-ownership-runtime.test.ts tooling/vitest/unit/model-ownership.test.ts tooling/fixtures/canonical-model/model-ownership-v1.json
          git commit -m "Format M02.8 ownership implementation"
          git push origin HEAD:agent/m02-8-model-ownership
