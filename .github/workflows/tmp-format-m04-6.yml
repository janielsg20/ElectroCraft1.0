name: Temporary M04.6 formatter

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: >-
          npx prettier --write
          packages/application/src/projects/project-backup.ts
          apps/studio/src/features/projects/project-home.tsx
          tooling/vitest/integration/project-backup-pglite.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: m04-6-formatted-sources
          path: |
            packages/application/src/projects/project-backup.ts
            apps/studio/src/features/projects/project-home.tsx
            tooling/vitest/integration/project-backup-pglite.test.ts
