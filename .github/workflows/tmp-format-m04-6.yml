name: Temporary M04.6 formatter

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: >-
          npx prettier --write
          packages/application/src/projects/project-backup.ts
          apps/studio/src/features/projects/project-home.tsx
          tooling/vitest/integration/project-backup-pglite.test.ts
      - name: Commit exact formatter output when needed
        run: |
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/application/src/projects/project-backup.ts apps/studio/src/features/projects/project-home.tsx tooling/vitest/integration/project-backup-pglite.test.ts
          git commit -m 'style(m04.6): apply locked Prettier formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
