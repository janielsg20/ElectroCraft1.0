name: M03.9 Single Studio Theme Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/studio/index.html'
      - 'apps/studio/src/theme.ts'
      - 'apps/studio/src/theme-provider.tsx'
      - 'apps/studio/src/i18n/appearance.es.ts'
      - 'apps/studio/src/shell/appearance-panel.tsx'
      - 'apps/studio/src/shell/appearance.css'
      - 'packages/design-system/package.json'
      - 'packages/design-system/components.json'
      - 'packages/design-system/src/index.ts'
      - 'packages/design-system/src/components/ui/**'
      - 'packages/design-system/src/foundation/**'
      - 'packages/design-system/src/styles/**'
      - 'tooling/vitest/unit/editor-appearance-profile.test.ts'
      - 'tooling/vitest/contract/editor-appearance-isolation.test.ts'
      - 'tooling/vitest/contract/single-studio-theme-boundary.test.ts'
      - 'tooling/vitest/integration/editor-appearance-runtime.test.ts'
      - 'tooling/playwright/m03-9-appearance.spec.ts'
      - '.ai/DESIGN_SYSTEM.md'
      - '.ai/THEME_SYSTEM.md'
      - '.ai/ARCHITECTURE.md'
      - '.ai/RULES.md'
      - '.ai/MEMORY.md'
      - '.ai/DECISIONS.md'
      - '.ai/adr/ADR-STUDIO-SINGLE-SHADCN-RADIX-THEME.md'
      - '.github/workflows/m03-9-appearance.yml'
  push:
    branches:
      - main
      - codex/single-shadcn-radix-theme
    paths:
      - 'apps/studio/index.html'
      - 'apps/studio/src/theme.ts'
      - 'apps/studio/src/theme-provider.tsx'
      - 'apps/studio/src/i18n/appearance.es.ts'
      - 'apps/studio/src/shell/appearance-panel.tsx'
      - 'apps/studio/src/shell/appearance.css'
      - 'packages/design-system/package.json'
      - 'packages/design-system/components.json'
      - 'packages/design-system/src/index.ts'
      - 'packages/design-system/src/components/ui/**'
      - 'packages/design-system/src/foundation/**'
      - 'packages/design-system/src/styles/**'
      - 'tooling/vitest/unit/editor-appearance-profile.test.ts'
      - 'tooling/vitest/contract/editor-appearance-isolation.test.ts'
      - 'tooling/vitest/contract/single-studio-theme-boundary.test.ts'
      - 'tooling/vitest/integration/editor-appearance-runtime.test.ts'
      - 'tooling/playwright/m03-9-appearance.spec.ts'
      - '.ai/DESIGN_SYSTEM.md'
      - '.ai/THEME_SYSTEM.md'
      - '.ai/ARCHITECTURE.md'
      - '.ai/RULES.md'
      - '.ai/MEMORY.md'
      - '.ai/DECISIONS.md'
      - '.ai/adr/ADR-STUDIO-SINGLE-SHADCN-RADIX-THEME.md'
      - '.github/workflows/m03-9-appearance.yml'

permissions:
  contents: read
  statuses: write

defaults:
  run:
    shell: bash

jobs:
  m03-9:
    name: M03.9 Single Studio Theme
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'pending', context: 'electrocraft/M03.9', description: 'Single Studio theme gate running', target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify locked toolchain
        run: |
          test "$(node --version)" = 'v22.16.0'
          test "$(npm --version)" = '10.9.2'
          test "$(npm config get legacy-peer-deps)" = 'true'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify source formatting
        run: >-
          npx prettier --check
          .github/workflows/m03-9-appearance.yml
          apps/studio/index.html
          apps/studio/src/theme.ts
          apps/studio/src/theme-provider.tsx
          apps/studio/src/i18n/appearance.es.ts
          apps/studio/src/shell/appearance-panel.tsx
          apps/studio/src/shell/appearance.css
          packages/design-system/package.json
          packages/design-system/components.json
          packages/design-system/src/index.ts
          packages/design-system/src/styles/globals.css
          packages/design-system/src/styles/tokens.css
          packages/design-system/src/styles/studio-appearance-tokens.css
          tooling/vitest/unit/editor-appearance-profile.test.ts
          tooling/vitest/contract/editor-appearance-isolation.test.ts
          tooling/vitest/contract/single-studio-theme-boundary.test.ts
          tooling/vitest/integration/editor-appearance-runtime.test.ts
          tooling/playwright/m03-9-appearance.spec.ts
          .ai/DESIGN_SYSTEM.md
          .ai/THEME_SYSTEM.md
          .ai/ARCHITECTURE.md
          .ai/RULES.md
          .ai/MEMORY.md
          .ai/DECISIONS.md
          .ai/adr/ADR-STUDIO-SINGLE-SHADCN-RADIX-THEME.md

      - name: Execute dedicated unit contract integration suite
        run: >-
          npx vitest run --config vitest.config.ts
          tooling/vitest/unit/editor-appearance-profile.test.ts
          tooling/vitest/contract/editor-appearance-isolation.test.ts
          tooling/vitest/contract/single-studio-theme-boundary.test.ts
          tooling/vitest/integration/editor-appearance-runtime.test.ts

      - name: Install Playwright Chromium
        timeout-minutes: 8
        run: |
          if ! timeout 240s npx playwright install chromium; then
            echo 'First Chromium install attempt did not complete; retrying once on the same runner.'
            npx playwright install chromium
          fi

      - name: Execute dedicated browser audit
        run: npx playwright test --config playwright.config.ts tooling/playwright/m03-9-appearance.spec.ts

      - name: Execute full repository gate
        run: npm run check | tee m03-9-check.log

      - name: Emit closure marker
        run: echo PASS_M03_9_SINGLE_STUDIO_THEME | tee m03-9-closure.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m03-9-single-theme-evidence
          path: |
            m03-9-check.log
            m03-9-closure.log
            test-results/**
          if-no-files-found: warn

      - name: Publish final commit status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: '${{ job.status }}' === 'success' ? 'success' : 'failure', context: 'electrocraft/M03.9', description: 'M03.9 single Studio theme gate', target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
