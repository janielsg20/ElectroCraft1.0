name: Temporary M04.7 format fix

on:
  push:
    branches:
      - 'tmp/m04-7-format-20260825'
    paths:
      - '.github/workflows/tmp-m04-7-format.yml'
      - 'apps/studio/src/features/projects/workspace-settings.tsx'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write apps/studio/src/features/projects/workspace-settings.tsx
      - name: Commit exact Prettier output
        run: |
          if git diff --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio/src/features/projects/workspace-settings.tsx
          git commit -m 'style(m04.7): apply prettier to workspace settings'
          git push origin HEAD:tmp/m04-7-format-20260825
