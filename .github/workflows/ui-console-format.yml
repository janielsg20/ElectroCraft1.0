name: Temporary UI Console Format

on:
  push:
    branches:
      - codex/google-cloud-console-ui-refresh
    paths:
      - '.github/workflows/ui-console-format.yml'

permissions:
  contents: write

concurrency:
  group: temporary-ui-console-format
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: codex/google-cloud-console-ui-refresh

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format repository-owned UI sources
        run: |
          npm run format
          npx prettier --write \
            .github/workflows/m03-9-appearance.yml \
            .ai/DESIGN_SYSTEM.md \
            .ai/MEMORY.md \
            apps/studio/src/features/projects/project-choice.css \
            packages/design-system/src/components/ui/checkbox.tsx \
            packages/design-system/src/components/ui/radio-group.tsx \
            tooling/vitest/contract/studio-admin-console-style-boundary.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(ui): format console refresh'
          git push origin HEAD:codex/google-cloud-console-ui-refresh
