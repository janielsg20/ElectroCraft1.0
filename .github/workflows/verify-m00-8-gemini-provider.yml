name: Verify M00.8 Gemini Provider

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/gemini-provider-poc/**'
      - '.github/workflows/verify-m00-8-gemini-provider.yml'
      - '.ai/adr/ADR-GEMINI-PROVIDER.md'
      - '.ai/AI_PROVIDER_BASELINE.md'
      - '.ai/evidence/F00/M00.8/**'

concurrency:
  group: m00-8-gemini-provider
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  lockfile-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.lock.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: lock
        name: Ensure committed lockfile
        working-directory: experiments/gemini-provider-poc
        run: |
          if test -f package-lock.json; then
            echo 'created=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo 'created=true' >> "$GITHUB_OUTPUT"
      - name: Commit generated lockfile
        if: steps.lock.outputs.created == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/gemini-provider-poc/package-lock.json
          git commit -m 'Lock M00.8 Gemini provider dependencies'
          git push origin HEAD:main

  verify-static:
    needs: lockfile-bootstrap
    if: needs.lockfile-bootstrap.outputs.created == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/gemini-provider-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Registry health
        run: npm ping
      - name: Install committed dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full package/source/security gate
        run: npm run verify-static
      - name: Preserve static evidence
        if: always()
        run: mkdir -p artifacts && cp package-lock.json artifacts/package-lock.generated.json || true
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m00-8-gemini-static-evidence
          path: |
            experiments/gemini-provider-poc/artifacts/
            experiments/gemini-provider-poc/package-lock.json
          if-no-files-found: warn

  live-gemini:
    needs: [lockfile-bootstrap, verify-static]
    if: needs.lockfile-bootstrap.outputs.created == 'false' && needs.verify-static.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/gemini-provider-poc
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require server-only Gemini secret
        run: |
          if test -z "$GEMINI_API_KEY"; then
            echo 'BLOCKED_MISSING_GEMINI_API_KEY'
            exit 2
          fi
      - name: Install committed dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build exact pinned source
        run: npm run build
      - name: Execute real Gemini structured/tools/stream/image/Interactions gates
        run: npm run live
      - name: Live closure gate
        run: npm run closure-live
      - name: Upload sanitized live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m00-8-gemini-live-evidence
          path: experiments/gemini-provider-poc/artifacts/
          if-no-files-found: warn

  report-status:
    needs: [lockfile-bootstrap, verify-static, live-gemini]
    if: always() && needs.lockfile-bootstrap.outputs.created == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Publish auditable commit status
        env:
          GH_TOKEN: ${{ github.token }}
          STATIC_RESULT: ${{ needs.verify-static.result }}
          LIVE_RESULT: ${{ needs.live-gemini.result }}
        run: |
          STATE=failure
          DESCRIPTION='M00.8 Gemini provider gate failed or is blocked'
          if test "$STATIC_RESULT" = success && test "$LIVE_RESULT" = success; then
            STATE=success
            DESCRIPTION='M00.8 Gemini provider gate passed'
          fi
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$STATE\",\"target_url\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"description\":\"$DESCRIPTION\",\"context\":\"M00.8 Gemini Provider\"}"
