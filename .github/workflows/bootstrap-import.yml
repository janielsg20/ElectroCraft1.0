name: Bootstrap ElectroCraft M00.1

on:
  push:
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import-spec:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify transport chunks
        shell: bash
        run: sha256sum -c .bootstrap/checksums.txt

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          cat .bootstrap/part* > /tmp/electrocraft.b64
          base64 --decode /tmp/electrocraft.b64 > /tmp/electrocraft.tar.xz
          echo "a29816479205273a46e1158f7318977018e0915a63e24a3bb6a06341a460fb91  /tmp/electrocraft.tar.xz" | sha256sum -c -

      - name: Import exact M00.1 tree
        shell: bash
        run: |
          tar -xJf /tmp/electrocraft.tar.xz -C .
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import ElectroCraft M00.1 specification"
          git push
