name: M03.11 Final Format
on:
  push:
    branches: [codex/m03-11-contextual-help]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write tooling/scripts/verify-m03-11-help.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tooling/scripts/verify-m03-11-help.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(m03.11): format verifier'
          git push
