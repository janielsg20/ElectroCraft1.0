name: M03.10 Spanish-first i18n Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/i18n/**'
      - 'packages/editor-puck/**'
      - 'locales/es/**'
      - 'i18next.config.ts'
      - 'apps/studio/**'
      - 'tooling/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.ai/I18N_SPEC.md'
      - '.ai/STATE.md'
      - '.ai/TRACKING.md'
      - '.github/workflows/m03-10-i18n.yml'
  push:
    branches: [main]
    paths:
      - 'packages/i18n/**'
      - 'packages/editor-puck/**'
      - 'locales/es/**'
      - 'i18next.config.ts'
      - 'apps/studio/**'
      - 'tooling/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.ai/I18N_SPEC.md'
      - '.ai/STATE.md'
      - '.ai/TRACKING.md'
      - '.github/workflows/m03-10-i18n.yml'

permissions:
  contents: read

concurrency:
  group: m03-10-i18n-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: M03.10 Spanish-first typed i18n
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify locked toolchain
        run: |
          test "$(node --version)" = 'v22.16.0'
          test "$(npm --version)" = '10.9.2'
          test "$(npm config get legacy-peer-deps)" = 'true'
          test -f package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify M03.10 formatting
        run: >-
          npx prettier --check
          packages/i18n/package.json
          "packages/i18n/src/**/*.{ts,tsx}"
          "locales/es/*.json"
          i18next.config.ts
          tsconfig.base.json
          apps/studio/package.json
          apps/studio/src/main.tsx
          apps/studio/src/help/help-registry.ts
          apps/studio/src/shell/language-settings.tsx
          apps/studio/src/shell/sidebar-navigation.ts
          apps/studio/src/shell/app-shell-route.tsx
          apps/studio/src/shell/studio-topbar.tsx
          packages/editor-puck/src/puck-component-adapter.ts
          tooling/package-boundaries.json
          tooling/test/workspace-boundaries.test.mjs
          tooling/scripts/verify-m03-10-i18n.mjs
          tooling/scripts/verify-m03-10-ui-strings.mjs
          tooling/vitest/unit/i18n-runtime.test.ts
          tooling/vitest/contract/i18n-boundary.test.ts
          tooling/vitest/integration/i18n-react-runtime.test.ts
          tooling/playwright/m03-10-i18n.spec.ts
          .github/workflows/m03-10-i18n.yml

      - name: Verify structural M03.10 contract
        run: node tooling/scripts/verify-m03-10-i18n.mjs | tee m03-10-contract.log

      - name: Verify UI strings and i18next CLI lint
        run: |
          node tooling/scripts/verify-m03-10-ui-strings.mjs | tee m03-10-ui-strings.log
          npx i18next-cli lint --config i18next.config.ts | tee m03-10-i18next-cli.log

      - name: Execute dedicated unit contract integration suite
        run: >-
          npx vitest run --config vitest.config.ts
          tooling/vitest/unit/i18n-runtime.test.ts
          tooling/vitest/contract/i18n-boundary.test.ts
          tooling/vitest/integration/i18n-react-runtime.test.ts
          | tee m03-10-vitest.log

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Execute dedicated browser audit
        run: npx playwright test tooling/playwright/m03-10-i18n.spec.ts --config playwright.config.ts | tee m03-10-playwright.log

      - name: Execute full repository gate
        run: npm run check | tee m03-10-full-gate.log

      - name: Emit closure marker
        run: echo PASS_M03_10_SPANISH_FIRST_I18N | tee m03-10-closure.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m03-10-i18n-evidence
          path: |
            m03-10-contract.log
            m03-10-ui-strings.log
            m03-10-i18next-cli.log
            m03-10-vitest.log
            m03-10-playwright.log
            m03-10-full-gate.log
            m03-10-closure.log
            apps/studio/dist
