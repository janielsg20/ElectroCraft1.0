name: Import ElectroCraft M00.1

on:
  push:
    branches: [main]
    paths:
      - '.import/READY'

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and extract package
        shell: bash
        run: |
          set -euo pipefail
          cat .import/package.part* > /tmp/electrocraft.b64
          base64 -d /tmp/electrocraft.b64 > /tmp/electrocraft.tar.xz
          mkdir -p /tmp/electrocraft
          tar -xJf /tmp/electrocraft.tar.xz -C /tmp/electrocraft
          src='/tmp/electrocraft/ElectroCraft_Eighth_Final_Master_Spec'
          test -f "$src/README.md"
          test -f "$src/.ai/STATE.md"
          test -f "$src/.ai/TRACKING.md"
          cp -a "$src/." .
          rm -rf .import
          rm -f .github/workflows/import-electrocraft.yml

      - name: Verify imported state
        shell: bash
        run: |
          set -euo pipefail
          count=$(find . -type f -not -path './.git/*' | wc -l)
          echo "Imported files: $count"
          test "$count" -ge 400
          grep -q 'M00.2' .ai/STATE.md

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import ElectroCraft M00.1 implementation'
          git push origin main
