name: UI Theme Reconcile

on:
  push:
    branches:
      - codex/single-shadcn-radix-theme
    paths:
      - '.github/workflows/ui-theme-reconcile.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: codex/single-shadcn-radix-theme
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify locked toolchain
        run: |
          test "$(node --version)" = 'v22.16.0'
          test "$(npm --version)" = '10.9.2'
          test "$(npm config get legacy-peer-deps)" = 'true'

      - name: Reconcile lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply repository formatting
        run: >-
          npx prettier --write
          .github/workflows/m03-9-appearance.yml
          apps/studio/index.html
          apps/studio/src/theme.ts
          apps/studio/src/theme-provider.tsx
          apps/studio/src/i18n/appearance.es.ts
          apps/studio/src/shell/appearance-panel.tsx
          apps/studio/src/shell/appearance.css
          packages/design-system/package.json
          packages/design-system/components.json
          packages/design-system/src/index.ts
          packages/design-system/src/styles/globals.css
          packages/design-system/src/styles/tokens.css
          packages/design-system/src/styles/studio-appearance-tokens.css
          tooling/vitest/unit/editor-appearance-profile.test.ts
          tooling/vitest/contract/editor-appearance-isolation.test.ts
          tooling/vitest/contract/single-studio-theme-boundary.test.ts
          tooling/vitest/contract/design-system-owner-boundary.test.ts
          tooling/vitest/contract/app-shell-e2e-boundary.test.ts
          tooling/vitest/integration/editor-appearance-runtime.test.ts
          tooling/vitest/integration/design-system-studio-foundation.test.ts
          tooling/playwright/m03-9-appearance.spec.ts
          tooling/scripts/verify-m03-1-design-system.mjs
          .ai/DESIGN_SYSTEM.md
          .ai/THEME_SYSTEM.md
          .ai/ARCHITECTURE.md
          .ai/RULES.md
          .ai/MEMORY.md
          .ai/DECISIONS.md
          .ai/adr/ADR-STUDIO-SINGLE-SHADCN-RADIX-THEME.md

      - name: Commit reconciled artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json \
            .github/workflows/m03-9-appearance.yml \
            apps/studio/index.html \
            apps/studio/src/theme.ts \
            apps/studio/src/theme-provider.tsx \
            apps/studio/src/i18n/appearance.es.ts \
            apps/studio/src/shell/appearance-panel.tsx \
            apps/studio/src/shell/appearance.css \
            packages/design-system/package.json \
            packages/design-system/components.json \
            packages/design-system/src/index.ts \
            packages/design-system/src/styles/globals.css \
            packages/design-system/src/styles/tokens.css \
            packages/design-system/src/styles/studio-appearance-tokens.css \
            tooling/vitest/unit/editor-appearance-profile.test.ts \
            tooling/vitest/contract/editor-appearance-isolation.test.ts \
            tooling/vitest/contract/single-studio-theme-boundary.test.ts \
            tooling/vitest/contract/design-system-owner-boundary.test.ts \
            tooling/vitest/contract/app-shell-e2e-boundary.test.ts \
            tooling/vitest/integration/editor-appearance-runtime.test.ts \
            tooling/vitest/integration/design-system-studio-foundation.test.ts \
            tooling/playwright/m03-9-appearance.spec.ts \
            tooling/scripts/verify-m03-1-design-system.mjs \
            .ai/DESIGN_SYSTEM.md \
            .ai/THEME_SYSTEM.md \
            .ai/ARCHITECTURE.md \
            .ai/RULES.md \
            .ai/MEMORY.md \
            .ai/DECISIONS.md \
            .ai/adr/ADR-STUDIO-SINGLE-SHADCN-RADIX-THEME.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ui): reconcile lockfile and formatting'
            git push origin HEAD:codex/single-shadcn-radix-theme
          fi
