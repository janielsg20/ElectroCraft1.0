name: Verify M00.7 Native Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/m00-7-native-runtime/**'
      - '.github/workflows/verify-m00-7-native-runtime.yml'
      - '.ai/adr/ADR-0007-native-runtime-poc.md'
      - '.ai/evidence/F00/M00.7/**'

permissions:
  contents: read

jobs:
  verify-source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: experiments/m00-7-native-runtime
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Registry health
        run: npm ping
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full source/build gate
        run: npm run verify
      - name: Preserve generated lockfile
        if: always()
        run: mkdir -p artifacts && cp package-lock.json artifacts/package-lock.generated.json || true
      - name: Upload source/build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m00-7-native-source-build-evidence
          path: |
            experiments/m00-7-native-runtime/artifacts/
            experiments/m00-7-native-runtime/package-lock.json
          if-no-files-found: warn

  android-runtime:
    needs: verify-source-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
    defaults:
      run:
        working-directory: experiments/m00-7-native-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Android native source
        run: npx expo prebuild --platform android --clean --no-install
      - name: Verify sensitive-permission pruning in generated source
        run: node scripts/prebuild-summary.mjs
      - name: Build Android release APK for emulator ABI
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Run real Android SQLite/Drizzle/Zustand/Refine and deep-link guard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          script: bash experiments/m00-7-native-runtime/scripts/android-runtime-e2e.sh
      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m00-7-android-runtime-evidence
          path: experiments/m00-7-native-runtime/artifacts/
          if-no-files-found: warn
