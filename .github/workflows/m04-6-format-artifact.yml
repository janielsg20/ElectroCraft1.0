name: M04.6 Format Artifact

on:
  push:
    branches: [codex/m04-6-current-main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format M04.6 files
        run: |
          npx prettier --write \
            packages/application/src/projects/project-storage.ts \
            apps/studio/src/features/projects/project-home.tsx \
            apps/studio/src/features/projects/project-storage-runtime.ts \
            tooling/vitest/integration/project-backup-pglite.test.ts \
            tooling/vitest/unit/project-backup-contract.test.ts \
            tooling/playwright/m04-6-backup-import.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: m04-6-prettier-files
          path: |
            packages/application/src/projects/project-storage.ts
            apps/studio/src/features/projects/project-home.tsx
            apps/studio/src/features/projects/project-storage-runtime.ts
            tooling/vitest/integration/project-backup-pglite.test.ts
            tooling/vitest/unit/project-backup-contract.test.ts
            tooling/playwright/m04-6-backup-import.spec.ts
