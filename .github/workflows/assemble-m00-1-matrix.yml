name: Assemble M00.1 matrix

on:
  push:
    branches: [main]
    paths:
      - '.import/MATRIX_READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and validate matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/m00-1-requirements
          cat .import/matrix.part00 .import/matrix.part01 .import/matrix.part02 > experiments/m00-1-requirements/capability-ownership-matrix.json
          echo '721f61b32efbc95b2f83024b763b6c759cb508f672d53848898d07cdb5b02248  experiments/m00-1-requirements/capability-ownership-matrix.json' | sha256sum -c -
          node experiments/m00-1-requirements/scripts/validate-matrix.mjs
          (
            cd experiments/m00-1-requirements
            npm run lint
            npm run typecheck
            npm test
            npm run build
          )
          sed -i 's#ReleaseGate / Security / A11y /Performance#ReleaseGate / Security / A11y / Performance#g' .ai/TRACEABILITY_MATRIX.md

      - name: Remove staging and temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import
          rm -f .github/workflows/import-electrocraft.yml
          rm -f .github/workflows/assemble-m00-1-matrix.yml

      - name: Commit finalized M00.1 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize ElectroCraft M00.1 GitHub import'
          git push origin main
