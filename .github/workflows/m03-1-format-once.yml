name: M03.1 Format Once

on:
  push:
    branches: [agent/m03-1-design-system]
    paths:
      - '.github/workflows/m03-1-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m03-1-design-system
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format M03.1 files
        run: |
          npx prettier --write \
            packages/design-system/src/components/ui/badge.tsx \
            packages/design-system/src/components/ui/dropdown-menu.tsx \
            packages/design-system/src/components/ui/scroll-area.tsx \
            packages/design-system/src/components/ui/sheet.tsx \
            packages/design-system/src/components/ui/skeleton.tsx \
            packages/design-system/src/components/ui/tooltip.tsx \
            packages/design-system/src/theme.css \
            apps/studio/src/App.tsx \
            apps/studio/src/i18n/es.ts \
            tooling/playwright/design-system-gallery.spec.ts
      - name: Remove one-shot formatter
        run: git rm .github/workflows/m03-1-format-once.yml
      - name: Commit formatting
        run: |
          git config user.name electrocraft-ci
          git config user.email 72001897+janielsg20@users.noreply.github.com
          git add packages/design-system/src apps/studio/src tooling/playwright
          git commit -m "Format M03.1 design system"
          git push origin HEAD:agent/m03-1-design-system
