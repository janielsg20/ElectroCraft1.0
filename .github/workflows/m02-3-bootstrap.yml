name: M02.3 Bootstrap

on:
  push:
    branches:
      - agent/m02-3-data-query-form-ownership

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Verify npm
        run: test "$(npm --version)" = '10.9.2'
      - name: Install and refresh root lock
        run: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Verify engine pins
        run: |
          node -e "const p=require('./node_modules/@react-querybuilder/core/package.json'); if(p.version!=='8.23.0') throw new Error('expected @react-querybuilder/core@8.23.0');"
          node -e "const p=require('./node_modules/zod/package.json'); if(p.version!=='4.4.3') throw new Error('expected zod@4.4.3');"
      - name: Apply repository formatting
        run: npm run format
      - name: Commit generated lock and formatting
        run: |
          if git diff --quiet; then
            echo 'No bootstrap changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json package.json packages/domain packages/application packages/data-core packages/query-rqb packages/forms tooling/vitest tooling/fixtures/canonical-model tooling/fixtures/help.architecture.models.json .github/workflows/m02-3-data-ownership.yml
          git commit -m 'Bootstrap M02.3 lock and formatting'
          git push origin HEAD:agent/m02-3-data-query-form-ownership
