name: M02.7 Format One Shot

on:
  push:
    branches:
      - agent/m02-7-export-ir
    paths:
      - '.github/workflows/m02-7-format-one-shot.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m02-7-export-ir
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npx prettier --write \
            packages/domain/src/contracts/export-ir.ts \
            packages/application/src/export-ir-service.ts \
            tooling/vitest/contract/export-ir-boundary.test.ts
      - name: Commit format change
        run: |
          if git diff --quiet; then
            echo "M02.7 files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain/src/contracts/export-ir.ts packages/application/src/export-ir-service.ts tooling/vitest/contract/export-ir-boundary.test.ts
          git commit -m "Format M02.7 canonical ExportIR"
          git push origin HEAD:agent/m02-7-export-ir
