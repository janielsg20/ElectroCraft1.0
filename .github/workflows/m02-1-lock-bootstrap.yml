name: M02.1 Lock Bootstrap

on:
  push:
    branches:
      - agent/m02-1-project-document-model
    paths:
      - 'packages/domain/package.json'
      - '.github/workflows/m02-1-lock-bootstrap.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Verify npm
        run: test "$(npm --version)" = '10.9.2'
      - name: Generate locked Zod dependency
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Verify Zod lock
        run: node -e "const p=require('./package-lock.json'); const z=p.packages['node_modules/zod']; if(!z || z.version!=='4.4.3') throw new Error('expected zod@4.4.3'); console.log('zod@'+z.version)"
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock Zod 4.4.3 for M02.1'
          git push origin HEAD:agent/m02-1-project-document-model
