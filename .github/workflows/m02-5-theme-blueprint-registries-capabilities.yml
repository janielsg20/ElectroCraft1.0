name: M02.5 Theme Blueprint Registry Capability Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - 'packages/export-ir/**'
      - 'tooling/fixtures/canonical-model/**'
      - 'tooling/fixtures/help.architecture.models.json'
      - 'tooling/vitest/unit/theme-blueprint-registry-capability.test.ts'
      - 'tooling/vitest/contract/theme-blueprint-registry-capability-boundary.test.ts'
      - 'tooling/vitest/integration/theme-blueprint-registry-capability-runtime.test.ts'
      - '.ai/HELP_ARCHITECTURE_MODELS.md'
      - '.ai/MODEL_OWNERSHIP.md'
      - '.ai/CODEBASE_LOCATION_MAP.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m02-5-theme-blueprint-registries-capabilities.yml'
  push:
    branches: [main]
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - 'packages/export-ir/**'
      - 'tooling/fixtures/canonical-model/**'
      - 'tooling/fixtures/help.architecture.models.json'
      - 'tooling/vitest/unit/theme-blueprint-registry-capability.test.ts'
      - 'tooling/vitest/contract/theme-blueprint-registry-capability-boundary.test.ts'
      - 'tooling/vitest/integration/theme-blueprint-registry-capability-runtime.test.ts'
      - '.ai/HELP_ARCHITECTURE_MODELS.md'
      - '.ai/MODEL_OWNERSHIP.md'
      - '.ai/CODEBASE_LOCATION_MAP.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m02-5-theme-blueprint-registries-capabilities.yml'

permissions:
  contents: read
  statuses: write

defaults:
  run:
    shell: bash

jobs:
  m02-5:
    name: M02.5 theme/blueprint/registry/capability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'electrocraft/M02.5',
              description: 'M02.5 theme/blueprint/registry/capability gate running',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify locked toolchain
        run: |
          test "$(node --version)" = 'v22.16.0'
          test "$(npm --version)" = '10.9.2'
          test "$(npm config get legacy-peer-deps)" = 'true'
          test -f package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify M02.5 canonical boundary engine
        run: |
          node -e "const p=require('./node_modules/zod/package.json'); if(p.version!=='4.4.3') throw new Error('expected zod@4.4.3, got '+p.version); console.log('zod@'+p.version)"
          node -e "const p=require('./tooling/package-boundaries.json'); if(Object.keys(p.packages).length!==17) throw new Error('F01 owner package count drift'); if(p.packages['@electrocraft/contracts']) throw new Error('parallel contracts package detected'); console.log('ownerPackages='+Object.keys(p.packages).length)"

      - name: Execute M02.5 tests with generated evidence
        run: |
          mkdir -p .evidence/m02-5
          ELECTROCRAFT_EVIDENCE_DIR=.evidence/m02-5 npm run test:m02-5 | tee m02-5-tests.log

      - name: Execute full repository pipeline
        run: npm run check | tee m02-5-check.log

      - name: Verify generated M02.5 evidence
        run: |
          test -f .evidence/m02-5/m02-5-blueprint-install-report.json
          test -f .evidence/m02-5/m02-5-capability-report.json
          test -f .evidence/m02-5/m02-5-export-capability-plan.json
          node -e "const r=require('./.evidence/m02-5/m02-5-capability-report.json'); if(!r.blocked) throw new Error('expected blocked capability coverage'); if(!r.entries.some((e)=>e.mode==='supported') || !r.entries.some((e)=>e.mode==='adapted') || !r.entries.some((e)=>e.mode==='blocked')) throw new Error('supported/adapted/blocked evidence incomplete'); console.log('capabilityEntries='+r.entries.length)"
          node -e "const r=require('./.evidence/m02-5/m02-5-blueprint-install-report.json'); if(!r.journal?.rolledBack) throw new Error('rollback evidence missing'); if(!r.conflictPlan?.conflicts?.length) throw new Error('conflict evidence missing'); console.log('blueprintConflicts='+r.conflictPlan.conflicts.length)"

      - name: Emit M02.5 closure candidate marker
        run: echo PASS_M02_5_THEME_BLUEPRINT_REGISTRY_CAPABILITY | tee m02-5-closure.log

      - name: Upload M02.5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: m02-5-theme-blueprint-registry-capability-evidence
          path: |
            m02-5-tests.log
            m02-5-check.log
            m02-5-closure.log
            .evidence/m02-5/*.json
            tooling/fixtures/canonical-model/project-v3.json
            tooling/fixtures/canonical-model/screen-v3.json
            tooling/fixtures/canonical-model/form-v3.json
            tooling/fixtures/canonical-model/template-v3.json
            tooling/fixtures/canonical-model/theme-v1.json
            tooling/fixtures/canonical-model/blueprint-package-v1.json
            tooling/fixtures/canonical-model/blueprint-install-conflict-rollback-v1.json
            tooling/fixtures/canonical-model/capability-registry-v1.json
            tooling/fixtures/canonical-model/capability-supported-adapted-blocked-v1.json
            tooling/fixtures/canonical-model/registry-definition-user-v1.json
            tooling/fixtures/help.architecture.models.json
          if-no-files-found: error

      - name: Publish final commit status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'electrocraft/M02.5',
              description: 'M02.5 theme/blueprint/registry/capability gate',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
