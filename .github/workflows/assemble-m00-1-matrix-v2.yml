name: Assemble M00.1 matrix v2

on:
  push:
    branches: [main]
    paths:
      - '.import/MATRIX_READY_V2'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact matrix from Base64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/m00-1-requirements
          cat .import/matrix64.part00 .import/matrix64.part01 .import/matrix64.part02 .import/matrix64.part03 .import/matrix64.part04 .import/matrix64.part05 .import/matrix64.part06 .import/matrix64.part07 > /tmp/matrix.b64
          base64 --decode /tmp/matrix.b64 > experiments/m00-1-requirements/capability-ownership-matrix.json
          sha256sum experiments/m00-1-requirements/capability-ownership-matrix.json
          echo '721f61b32efbc95b2f83024b763b6c759cb508f672d53848898d07cdb5b02248  experiments/m00-1-requirements/capability-ownership-matrix.json' | sha256sum --check --strict
          sed -i 's#ReleaseGate / Security / A11y /Performance#ReleaseGate / Security / A11y / Performance#g' .ai/TRACEABILITY_MATRIX.md

      - name: Validate M00.1 fixture
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/m00-1-requirements
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Remove import staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import
          rm -f .github/workflows/import-electrocraft.yml
          rm -f .github/workflows/assemble-m00-1-matrix.yml
          rm -f .github/workflows/assemble-m00-1-matrix-v2.yml

      - name: Commit finalized M00.1 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize ElectroCraft M00.1 GitHub import'
          git push origin main
