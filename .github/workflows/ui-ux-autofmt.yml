name: Temporary UI UX Gallery Formatter

on:
  push:
    branches:
      - codex/ui-ux-style-gallery
    paths:
      - '.github/workflows/ui-ux-autofmt.yml'

permissions:
  contents: write

jobs:
  format-and-remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ui-ux-style-gallery
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format gallery sources with repository Prettier
        run: >-
          npx prettier --write
          apps/studio/src/theme-provider.tsx
          apps/studio/src/market-appearance-presets.ts
          apps/studio/src/shell/appearance-framework-gallery.tsx
          apps/studio/src/shell/appearance-market.css
          tooling/vitest/unit/market-appearance-presets.test.ts
          tooling/playwright/ui-ux-style-gallery.spec.ts
          .github/workflows/m03-9-appearance.yml
      - name: Remove temporary formatter and commit exact output
        run: |
          rm .github/workflows/ui-ux-autofmt.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: format UI UX gallery'
          git push origin HEAD:codex/ui-ux-style-gallery
