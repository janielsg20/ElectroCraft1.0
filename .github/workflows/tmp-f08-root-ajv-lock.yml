name: F08 Temporary Root Ajv Lock Refresh

on:
  push:
    branches:
      - codex/m08-1-data-sources

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[skip-f08-root-ajv-lock]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/m08-1-data-sources
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify npm version
        run: test "$(npm --version)" = '10.9.2'
      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(M08.3): hoist Ajv in lockfile [skip-f08-root-ajv-lock]"
          git push origin HEAD:codex/m08-1-data-sources
