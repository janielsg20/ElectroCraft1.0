name: M03.5 Editor Layout Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/studio/**'
      - 'packages/design-system/**'
      - 'packages/editor-puck/**'
      - 'tooling/vitest/**/editor-*.test.ts'
      - 'tooling/test/m03-5-editor-layout.test.mjs'
      - 'tooling/playwright/m03-5-editor-layout.spec.ts'
      - 'tooling/scripts/verify-m03-4-topbar.mjs'
      - '.ai/evidence/F03/M03.4/**'
      - '.ai/evidence/F03/M03.5/**'
      - '.ai/STATE.md'
      - '.ai/TRACKING.md'
      - '.ai/HANDOFF.md'
      - '.ai/MEMORY.md'
      - '.github/workflows/m03-5-editor-layout.yml'
  push:
    branches: [main]
    paths:
      - 'apps/studio/**'
      - 'packages/design-system/**'
      - 'packages/editor-puck/**'
      - 'tooling/vitest/**/editor-*.test.ts'
      - 'tooling/test/m03-5-editor-layout.test.mjs'
      - 'tooling/playwright/m03-5-editor-layout.spec.ts'
      - 'tooling/scripts/verify-m03-4-topbar.mjs'
      - '.ai/evidence/F03/M03.4/**'
      - '.ai/evidence/F03/M03.5/**'
      - '.ai/STATE.md'
      - '.ai/TRACKING.md'
      - '.ai/HANDOFF.md'
      - '.ai/MEMORY.md'
      - '.github/workflows/m03-5-editor-layout.yml'

permissions:
  contents: read
  statuses: write

defaults:
  run:
    shell: bash

jobs:
  m03-5:
    name: M03.5 Context Canvas Inspector Status
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'pending', context: 'electrocraft/M03.5', description: 'M03.5 editor layout gate running', target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify locked toolchain
        run: |
          test "$(node --version)" = 'v22.16.0'
          test "$(npm --version)" = '10.9.2'
          test "$(npm config get legacy-peer-deps)" = 'true'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Emit exact M03.5 Prettier candidate
        run: |
          npx prettier --write tooling/test/m03-5-editor-layout.test.mjs
          echo '---BEGIN_M03_5_PRETTIER_CANDIDATE---'
          cat tooling/test/m03-5-editor-layout.test.mjs
          echo '---END_M03_5_PRETTIER_CANDIDATE---'
          exit 1

      - name: Execute dedicated M03.5 structural suite
        run: node --test tooling/test/m03-5-editor-layout.test.mjs

      - name: Execute dedicated M03.5 unit contract integration suite
        run: >-
          npx vitest run --config vitest.config.ts
          tooling/vitest/unit/editor-layout-model.test.ts
          tooling/vitest/contract/editor-workspace-boundary.test.ts
          tooling/vitest/integration/editor-puck-composition.test.ts

      - name: Install Playwright Chromium
        timeout-minutes: 8
        run: |
          if ! timeout 240s npx playwright install chromium; then
            echo 'First Chromium install attempt did not complete; retrying once on the same runner.'
            npx playwright install chromium
          fi

      - name: Execute dedicated M03.5 browser audit
        run: npx playwright test --config playwright.config.ts tooling/playwright/m03-5-editor-layout.spec.ts

      - name: Execute full repository gate
        run: npm run check | tee m03-5-check.log

      - name: Emit closure marker
        run: echo PASS_M03_5_EDITOR_LAYOUT | tee m03-5-closure.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m03-5-editor-layout-evidence
          path: |
            m03-5-check.log
            m03-5-closure.log
            test-results/**
            .ai/evidence/F03/M03.5/**
          if-no-files-found: warn

      - name: Publish final commit status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: '${{ job.status }}' === 'success' ? 'success' : 'failure', context: 'electrocraft/M03.5', description: 'M03.5 editor layout gate', target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
