name: ElectroCraft F07 Maintenance

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'codex/m07-1-navigation-model'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/m07-1-navigation-model
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply F07 repairs
        run: python tooling/scripts/f07-maintenance-repair.py
      - name: Format canonical workspace
        run: npm run format
      - name: Verify typecheck
        run: npm run typecheck
      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps packages tooling
          if git diff --cached --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git commit -m 'fix(F07): normalize formatting and resolve typecheck blockers'
          git push origin HEAD:codex/m07-1-navigation-model
