name: ElectroCraft Base CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: base-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Locked lint typecheck test build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify locked toolchain contract
        run: |
          test "$(node --version)" = 'v22.16.0'
          test "$(npm --version)" = '10.9.2'
          test "$(npm config get legacy-peer-deps)" = 'true'
          test -f package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify documentation conventions
        run: npm run test:docs
      - name: Prepare F07 canonical formatting artifact
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/m07-1-navigation-model'
        run: |
          npm run format
          rm -rf f07-format-output
          git diff --name-only -z | while IFS= read -r -d '' file; do
            mkdir -p "f07-format-output/$(dirname "$file")"
            cp "$file" "f07-format-output/$file"
          done
      - name: Upload F07 canonical formatting artifact
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/m07-1-navigation-model'
        uses: actions/upload-artifact@v4
        with:
          name: f07-prettier-canonical-${{ github.run_id }}
          path: f07-format-output
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright repository gate
        run: npm run test:e2e
      - name: Empty repository fixture
        run: npm run test:empty-repo
      - name: Verify CI base artifact
        run: npm run build:ci | tee m01-5-ci-base.log
      - name: Verify M01.6 documentation artifact
        run: npm run build:docs | tee m01-6-doc-conventions.log
      - name: Emit M01.5 closure candidate marker
        run: echo PASS_M01_5_BASE_CI | tee m01-5-closure.log
      - name: Emit M01.6 closure candidate marker
        run: echo PASS_M01_6_DOC_CONVENTIONS | tee m01-6-closure.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m01-5-base-ci-evidence
          path: |
            tooling/dist/m01-5-ci-base-report.json
            apps/studio/dist
            m01-5-ci-base.log
            m01-5-closure.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m01-6-doc-conventions-evidence
          path: |
            tooling/dist/m01-6-doc-conventions-report.json
            m01-6-doc-conventions.log
            m01-6-closure.log
