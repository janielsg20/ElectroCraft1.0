name: ElectroCraft Base CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: base-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Locked lint typecheck test build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format F06 closure files
        run: npm run format
      - uses: actions/upload-artifact@v4
        with:
          name: f06-prettier-files
          path: |
            packages/application/src/editor-canvas-preferences.ts
            packages/editor-puck/src/puck-canvas-guides.ts
            packages/editor-puck/src/puck-editor-composition.ts
            packages/editor-puck/src/puck-platform-controls.ts
            packages/design-system/src/components/ui/platform-badge.tsx
            apps/studio/src/features/editor/advanced/platform-style-inspector.tsx
            apps/studio/src/features/editor/puck-document-session.ts
            apps/studio/src/features/editor/puck-editor-runtime.ts
            tooling/vitest/contract/platform-overrides-boundary.test.ts
            tooling/vitest/integration/platform-canvas-style.test.ts
            tooling/vitest/unit/puck-context-controls.test.ts
            tooling/playwright/m06-3-platform-overrides.spec.ts
            tooling/playwright/m06-5-advanced-selection.spec.ts
            tooling/playwright/m06-6-context-actions.spec.ts
