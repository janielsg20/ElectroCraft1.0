name: M03.11 Contextual Help Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/design-system/**'
      - 'packages/i18n/**'
      - 'locales/es/help.json'
      - 'apps/studio/src/help/**'
      - 'apps/studio/src/shell/**'
      - 'apps/studio/src/App.tsx'
      - 'tooling/**'
      - '.ai/SECTION_HELP_CATALOG_ES.md'
      - '.ai/APP_SHELL_SPEC.md'
      - '.ai/STATE.md'
      - '.ai/TRACKING.md'
      - '.github/workflows/m03-11-help.yml'
  push:
    branches: [main]
    paths:
      - 'packages/design-system/**'
      - 'packages/i18n/**'
      - 'locales/es/help.json'
      - 'apps/studio/src/help/**'
      - 'apps/studio/src/shell/**'
      - 'apps/studio/src/App.tsx'
      - 'tooling/**'
      - '.ai/SECTION_HELP_CATALOG_ES.md'
      - '.ai/APP_SHELL_SPEC.md'
      - '.ai/STATE.md'
      - '.ai/TRACKING.md'
      - '.github/workflows/m03-11-help.yml'

permissions:
  contents: read

concurrency:
  group: m03-11-help-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: M03.11 contextual Help system
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify locked toolchain
        run: |
          test "$(node --version)" = 'v22.16.0'
          test "$(npm --version)" = '10.9.2'
          test "$(npm config get legacy-peer-deps)" = 'true'
          test -f package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify M03.11 formatting
        run: >-
          npx prettier --check
          packages/design-system/src/components/ui/popover.tsx
          packages/design-system/src/components/ui/index.ts
          locales/es/help.json
          apps/studio/src/help/help-registry.ts
          apps/studio/src/help/help-ui.tsx
          apps/studio/src/shell/studio-topbar.tsx
          apps/studio/src/shell/language-settings.tsx
          apps/studio/src/shell/information-architecture-ui.tsx
          apps/studio/src/App.tsx
          tooling/scripts/verify-m03-10-i18n.mjs
          tooling/scripts/verify-m03-11-help.mjs
          tooling/vitest/unit/help-registry.test.ts
          tooling/vitest/contract/help-system-boundary.test.ts
          tooling/vitest/integration/help-runtime.test.ts
          tooling/playwright/m03-11-help.spec.ts
          .github/workflows/m03-11-help.yml
          .ai/SECTION_HELP_CATALOG_ES.md

      - name: Verify structural M03.11 contract
        run: node tooling/scripts/verify-m03-11-help.mjs | tee m03-11-contract.log

      - name: Verify help namespace lint
        run: npx i18next-cli lint --config i18next.config.ts | tee m03-11-i18next-cli.log

      - name: Execute dedicated unit contract integration suite
        run: >-
          npx vitest run --config vitest.config.ts
          tooling/vitest/unit/help-registry.test.ts
          tooling/vitest/contract/help-system-boundary.test.ts
          tooling/vitest/integration/help-runtime.test.ts
          | tee m03-11-vitest.log

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Execute dedicated browser audit
        run: npx playwright test tooling/playwright/m03-11-help.spec.ts --config playwright.config.ts | tee m03-11-playwright.log

      - name: Execute full repository gate
        run: npm run check | tee m03-11-full-gate.log

      - name: Emit closure marker
        run: echo PASS_M03_11_CONTEXTUAL_HELP | tee m03-11-closure.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m03-11-contextual-help-evidence
          path: |
            m03-11-contract.log
            m03-11-i18next-cli.log
            m03-11-vitest.log
            m03-11-playwright.log
            m03-11-full-gate.log
            m03-11-closure.log
            apps/studio/dist
