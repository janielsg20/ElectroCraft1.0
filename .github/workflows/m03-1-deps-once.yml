name: M03.1 Dependencies Once

on:
  push:
    branches:
      - agent/m03-1-design-system
    paths:
      - '.github/workflows/m03-1-deps-once.yml'

permissions:
  contents: write

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m03-1-design-system
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pin design-system runtime dependencies
        run: |
          npm install --workspace @electrocraft/design-system --save-exact \
            radix-ui lucide-react class-variance-authority clsx tailwind-merge zod@4.4.3 react@19.2.8 react-dom@19.2.8
      - name: Pin Studio Tailwind v4 build dependencies
        run: |
          npm install --workspace @electrocraft/studio --save-dev --save-exact tailwindcss @tailwindcss/vite
      - name: Remove one-shot workflow
        run: git rm .github/workflows/m03-1-deps-once.yml
      - name: Commit locked dependency graph
        run: |
          git config user.name electrocraft-ci
          git config user.email 72001897+janielsg20@users.noreply.github.com
          git add package.json package-lock.json packages/design-system/package.json apps/studio/package.json
          git commit -m "Pin M03.1 design system dependencies"
          git push origin HEAD:agent/m03-1-design-system
