name: M01.3 Quality Toolchain Gate

on:
  workflow_call:
    inputs:
      head_sha:
        description: Exact commit SHA inherited from the F01 entry gate
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: M01.3 lint test build and empty-repo verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install exact root toolchain
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify exact toolchain pins
        run: node tooling/scripts/verify-toolchain.mjs | tee m01-3-toolchain.log
      - name: Run required root pipeline
        run: npm run check | tee m01-3-check.log
      - name: Run empty functional repository toolchain fixture
        run: npm run test:empty-repo | tee m01-3-empty-repo.log
      - name: Emit M01.3 closure marker
        run: |
          test -f tooling/dist/quality-toolchain-report.json
          grep -q '"microphase": "M01.3"' tooling/dist/quality-toolchain-report.json
          echo PASS_M01_3_QUALITY_TOOLCHAIN | tee m01-3-closure.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m01-3-quality-toolchain-evidence
          path: |
            tooling/dist
            apps/studio/dist
            m01-3-toolchain.log
            m01-3-check.log
            m01-3-empty-repo.log
            m01-3-closure.log
