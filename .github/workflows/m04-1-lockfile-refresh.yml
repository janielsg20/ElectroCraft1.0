name: M04.1 Lockfile Refresh

on:
  push:
    branches:
      - 'codex/m04-1-storage-foundation'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/m04-1-storage-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "chore: refresh M04.1 lockfile"
            git push origin HEAD:codex/m04-1-storage-foundation
          fi
