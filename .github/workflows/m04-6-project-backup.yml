name: M04.6 Project Backup Gate

on:
  pull_request:
    paths:
      - 'packages/application/src/projects/**'
      - 'apps/studio/src/features/projects/**'
      - 'tooling/vitest/integration/project-backup-pglite.test.ts'
      - 'tooling/playwright/m04-6-project-backup.spec.ts'
      - '.github/workflows/m04-6-project-backup.yml'
  push:
    branches: [main]
    paths:
      - 'packages/application/src/projects/**'
      - 'apps/studio/src/features/projects/**'
      - 'tooling/vitest/integration/project-backup-pglite.test.ts'
      - 'tooling/playwright/m04-6-project-backup.spec.ts'
      - '.github/workflows/m04-6-project-backup.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: M04.6 backup import restore round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: PGlite backup round-trip
        run: npx vitest run --config vitest.config.ts tooling/vitest/integration/project-backup-pglite.test.ts
      - name: Build Studio
        run: npm run build:studio
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser backup round-trip
        run: npx playwright test --config playwright.config.ts tooling/playwright/m04-6-project-backup.spec.ts
      - name: Emit closure candidate
        run: echo PASS_M04_6_PROJECT_BACKUP | tee m04-6-closure.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m04-6-project-backup-evidence
          path: |
            m04-6-closure.log
            test-results
            playwright-report
          if-no-files-found: ignore
