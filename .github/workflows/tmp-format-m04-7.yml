name: Temporary M04.7 formatter

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write apps/studio/src/features/projects/workspace-settings.tsx
      - name: Commit exact formatter output when needed
        run: |
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio/src/features/projects/workspace-settings.tsx
          git commit -m 'style(m04.7): apply locked Prettier formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
