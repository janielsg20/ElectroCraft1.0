name: M02.5 Format Bootstrap

on:
  push:
    branches:
      - agent/m02-5-theme-blueprint-registries-capabilities
    paths:
      - '.github/workflows/m02-5-format-bootstrap.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/m02-5-format-bootstrap.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/m02-5-theme-blueprint-registries-capabilities

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format M02.5 files
        run: |
          npx prettier --write \
            packages/domain/src/contracts/document.ts \
            packages/domain/src/contracts/serialization.ts \
            packages/application/src/blueprint-installer.ts \
            tooling/vitest/integration/theme-blueprint-registry-capability-runtime.test.ts \
            tooling/vitest/unit/theme-blueprint-registry-capability.test.ts \
            tooling/fixtures/canonical-model/capability-registry-v1.json

      - name: Commit formatted files
        run: |
          if git diff --quiet -- \
            packages/domain/src/contracts/document.ts \
            packages/domain/src/contracts/serialization.ts \
            packages/application/src/blueprint-installer.ts \
            tooling/vitest/integration/theme-blueprint-registry-capability-runtime.test.ts \
            tooling/vitest/unit/theme-blueprint-registry-capability.test.ts \
            tooling/fixtures/canonical-model/capability-registry-v1.json; then
            echo "M02.5 files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/domain/src/contracts/document.ts \
            packages/domain/src/contracts/serialization.ts \
            packages/application/src/blueprint-installer.ts \
            tooling/vitest/integration/theme-blueprint-registry-capability-runtime.test.ts \
            tooling/vitest/unit/theme-blueprint-registry-capability.test.ts \
            tooling/fixtures/canonical-model/capability-registry-v1.json
          git commit -m "Format M02.5 canonical ownership"
          git push origin HEAD:agent/m02-5-theme-blueprint-registries-capabilities
