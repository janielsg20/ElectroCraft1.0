name: M03.12 Format
on:
  push:
    branches: [codex/m03-12-appshell-e2e]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: >-
          npx prettier --write
          playwright.config.ts
          tooling/playwright/m03-12-appshell.spec.ts
          tooling/vitest/contract/app-shell-e2e-boundary.test.ts
          tooling/vitest/integration/app-shell-e2e-matrix.test.ts
          tooling/scripts/verify-m03-12-appshell.mjs
          docs/qa/F03_APPSHELL_E2E.md
          .ai/SCREEN_SPECS/F03_APPSHELL.md
          .github/workflows/m03-12-appshell-e2e.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add playwright.config.ts tooling/playwright/m03-12-appshell.spec.ts tooling/vitest/contract/app-shell-e2e-boundary.test.ts tooling/vitest/integration/app-shell-e2e-matrix.test.ts tooling/scripts/verify-m03-12-appshell.mjs docs/qa/F03_APPSHELL_E2E.md .ai/SCREEN_SPECS/F03_APPSHELL.md .github/workflows/m03-12-appshell-e2e.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(m03.12): format closure matrix'
          git push
