name: Audit runtime patch

on:
  push:
    branches: [codex/audit-remediation-2026-09-05]
    paths:
      - '.github/workflows/audit-runtime-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/audit-remediation-2026-09-05
      - name: Normalize relation cardinality guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/studio/src/features/data/data-model-runtime.ts')
          text = path.read_text()
          malformed = """    if (edges.length > 0 && patch.cardinality !== undefined && patch.cardinality !== relation.cardinality) {
              throw new Error('Elimina los vínculos existentes antes de cambiar la cardinalidad.');
            }
          """
          normalized = """    if (edges.length > 0 && patch.cardinality !== undefined && patch.cardinality !== relation.cardinality) {
              throw new Error('Elimina los vínculos existentes antes de cambiar la cardinalidad.');
            }
          """
          # YAML block indentation is stripped before execution. Normalize by line structure instead.
          lines = text.splitlines()
          for index, line in enumerate(lines):
              if "patch.cardinality !== undefined" in line:
                  lines[index] = "    if (edges.length > 0 && patch.cardinality !== undefined && patch.cardinality !== relation.cardinality) {"
                  lines[index + 1] = "      throw new Error('Elimina los vínculos existentes antes de cambiar la cardinalidad.');"
                  lines[index + 2] = "    }"
                  break
          else:
              raise SystemExit('cardinality guard was not found')
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'Runtime guard already normalized.'
            exit 0
          fi
          git add apps/studio/src/features/data/data-model-runtime.ts
          git commit -m 'style(M08.11): normalize cardinality guard'
          git push origin HEAD:codex/audit-remediation-2026-09-05
