name: M02.2 Component Layout Style Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - 'packages/editor-puck/**'
      - 'tooling/fixtures/canonical-model/**'
      - 'tooling/vitest/unit/component-layout-style.test.ts'
      - 'tooling/vitest/contract/component-layout-style-boundary.test.ts'
      - 'tooling/vitest/integration/component-layout-style-puck.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m02-2-component-layout-style.yml'
  push:
    branches: [main]
    paths:
      - 'packages/domain/**'
      - 'packages/application/**'
      - 'packages/editor-puck/**'
      - 'tooling/fixtures/canonical-model/**'
      - 'tooling/vitest/unit/component-layout-style.test.ts'
      - 'tooling/vitest/contract/component-layout-style-boundary.test.ts'
      - 'tooling/vitest/integration/component-layout-style-puck.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m02-2-component-layout-style.yml'
      - '.ai/STATE.md'
      - '.ai/TRACKING.md'

permissions:
  contents: read
  statuses: write

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: M02.2 component/layout/style + Puck adapter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish pending status
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'electrocraft/M02.2',
              description: 'M02.2 component/layout/style gate running',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify locked toolchain
        run: |
          test "$(node --version)" = 'v22.16.0'
          test "$(npm --version)" = '10.9.2'
          test "$(npm config get legacy-peer-deps)" = 'true'
          test -f package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify M02.2 engine pins
        run: |
          node -e "const p=require('./node_modules/zod/package.json'); if(p.version!=='4.4.3') throw new Error('expected zod@4.4.3, got '+p.version); console.log('zod@'+p.version)"
          node -e "const p=require('./node_modules/@puckeditor/core/package.json'); if(p.version!=='0.22.4') throw new Error('expected @puckeditor/core@0.22.4, got '+p.version); console.log('@puckeditor/core@'+p.version)"

      - name: Execute M02.2 unit contract integration tests
        run: npm run test:m02-2 | tee m02-2-model-tests.log

      - name: Execute full repository pipeline
        run: npm run check | tee m02-2-check.log

      - name: Emit M02.2 closure candidate marker
        run: echo PASS_M02_2_COMPONENT_LAYOUT_STYLE | tee m02-2-closure.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m02-2-component-layout-style-evidence
          path: |
            m02-2-model-tests.log
            m02-2-check.log
            m02-2-closure.log
            tooling/fixtures/canonical-model/component-definition-v1.json
            tooling/fixtures/canonical-model/component-definition-v0.json

      - name: Publish final commit status
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'electrocraft/M02.2',
              description: 'M02.2 component/layout/style + Puck adapter gate',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
