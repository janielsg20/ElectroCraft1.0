name: M02.9 Lock Once

on:
  push:
    branches:
      - agent/m02-9-engine-payload-wrappers
    paths:
      - '.github/workflows/m02-9-lock-once.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m02-9-engine-payload-wrappers
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Remove one-shot helper
        run: git rm .github/workflows/m02-9-lock-once.yml
      - name: Commit reproducible lockfile
        run: |
          git config user.name electrocraft-ci
          git config user.email 72001897+janielsg20@users.noreply.github.com
          git add package-lock.json
          git commit -m "Regenerate M02.9 dependency lock"
          git push origin HEAD:agent/m02-9-engine-payload-wrappers
