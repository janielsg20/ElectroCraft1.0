name: M02.9 Bootstrap Once

on:
  push:
    branches: [agent/m02-9-engine-payload-wrappers]
    paths:
      - '.github/workflows/m02-9-bootstrap-once.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m02-9-engine-payload-wrappers
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Register M02.9 root scripts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const workflow = '.github/workflows/m02-9-engine-payload-wrappers.yml';
          for (const key of ['format', 'format:check']) {
            if (!pkg.scripts[key].includes(workflow)) {
              pkg.scripts[key] = pkg.scripts[key].replace('.github/workflows/m02-8-model-ownership.yml', `.github/workflows/m02-8-model-ownership.yml ${workflow}`);
            }
          }
          pkg.scripts['test:m02-9'] = 'vitest run --config vitest.config.ts tooling/vitest/unit/engine-payload.test.ts tooling/vitest/contract/engine-payload-boundary.test.ts tooling/vitest/integration/engine-payload-runtime.test.ts';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Generate locked dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Format M02.9 files
        run: |
          npx prettier --write \
            package.json package-lock.json \
            .github/workflows/m02-9-engine-payload-wrappers.yml \
            packages/domain/src/contracts/engine-payload.ts \
            packages/domain/src/index.ts \
            packages/application/src/engine-payload-compatibility.ts \
            packages/application/src/index.ts \
            packages/query-rqb/src/engine-payload-adapter.ts \
            packages/query-rqb/src/index.ts \
            packages/media-tiptap/package.json \
            packages/media-tiptap/src/engine-payload-adapter.ts \
            packages/media-tiptap/src/index.ts \
            tooling/fixtures/canonical-model/engine-payload-rqb-v1.json \
            tooling/fixtures/canonical-model/engine-payload-tiptap-v1.json \
            tooling/fixtures/help.architecture.models.json \
            tooling/vitest/unit/engine-payload.test.ts \
            tooling/vitest/contract/engine-payload-boundary.test.ts \
            tooling/vitest/integration/engine-payload-runtime.test.ts
      - name: Remove bootstrap and publish
        run: |
          git rm .github/workflows/m02-9-bootstrap-once.yml
          git config user.name 'electrocraft-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/m02-9-engine-payload-wrappers.yml packages/domain packages/application packages/query-rqb packages/media-tiptap tooling/fixtures tooling/vitest
          git commit -m 'Finalize M02.9 lockfile and formatting'
          git push origin HEAD:agent/m02-9-engine-payload-wrappers
