name: M08.13 format helper

on:
  push:
    branches:
      - codex/m08-13-generic-field-indexer

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply locked Prettier and remove helper
        run: |
          npx prettier --write \
            packages/connectors/src/generic-field-index-adapter.ts \
            packages/data-web/src/generic-field-indexer.ts \
            packages/data-web/src/internal-relation-repository.ts \
            apps/studio/src/features/data/advanced-field-editor.tsx \
            apps/studio/src/features/data/data-source-runtime.ts \
            tooling/vitest/integration/m08-13-generic-field-index-pglite.test.ts
          rm .github/workflows/m08-13-format-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(M08.13): apply locked prettier formatting"
          git push origin HEAD:codex/m08-13-generic-field-indexer
