name: Deploy Studio to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/studio/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.github/workflows/cloudflare-pages.yml'

permissions:
  contents: read
  deployments: write
  statuses: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build and deploy Studio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish pending deployment status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'electrocraft/cloudflare-pages',
              description: 'Cloudflare Pages deployment running',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Studio
        run: npm run build:studio

      - name: Verify Pages output
        run: |
          test -f apps/studio/dist/index.html
          test -d apps/studio/dist/assets
          echo "Cloudflare Pages output verified: apps/studio/dist"

      - name: Check Cloudflare credentials
        id: cloudflare-credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare credentials are not configured. Build succeeded; deployment was skipped."
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cloudflare-credentials.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/studio/dist --project-name=electrocraft1-0 --branch=main

      - name: Deployment URL
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          echo "Deployment URL: $DEPLOYMENT_URL"
          echo "Production alias: $DEPLOYMENT_ALIAS_URL"

      - name: Publish final deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const credentialsAvailable = '${{ steps.cloudflare-credentials.outputs.available }}' === 'true';
            const deployOutcome = '${{ steps.deploy.outcome }}';
            const success = credentialsAvailable && deployOutcome === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'electrocraft/cloudflare-pages',
              description: success ? 'Cloudflare Pages deployment succeeded' : 'Cloudflare Pages deployment failed or was skipped',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
