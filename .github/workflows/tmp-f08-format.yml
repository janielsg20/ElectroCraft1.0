name: F08 Temporary Format

on:
  push:
    branches:
      - codex/m08-1-data-sources

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-f08-format]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/m08-1-data-sources
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify npm version
        run: test "$(npm --version)" = '10.9.2'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format F08 workspace
        run: npm run format
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Formatting already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(F08): apply repository formatting [skip-f08-format]"
          git push origin HEAD:codex/m08-1-data-sources
