name: M03.11 Compatibility Format
on:
  push:
    branches: [codex/m03-11-contextual-help]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write apps/studio/src/help/help-registry.ts tooling/vitest/contract/i18n-boundary.test.ts locales/es/help.json
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/studio/src/help/help-registry.ts tooling/vitest/contract/i18n-boundary.test.ts locales/es/help.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(m03.11): format compatibility updates'
          git push
