name: M02.9 Minimal Tiptap Lock Once

on:
  push:
    branches: [agent/m02-9-engine-payload-wrappers]
    paths:
      - '.github/workflows/m02-9-minimal-tiptap-lock-once.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/m02-9-minimal-tiptap-lock-once.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  lock:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m02-9-engine-payload-wrappers
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install regenerated lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify coherent Tiptap workspace
        run: |
          npm ls @tiptap/core@3.29.2 @tiptap/html@3.29.2 @tiptap/extension-document@3.29.2 @tiptap/extension-paragraph@3.29.2 @tiptap/extension-text@3.29.2 --workspace @electrocraft/media-tiptap --depth=0
          npm run test:m02-9
          npm run build:studio
      - name: Format affected files
        run: |
          npx prettier --write \
            package-lock.json \
            packages/media-tiptap/package.json \
            packages/media-tiptap/src/engine-payload-adapter.ts \
            .github/workflows/m02-9-engine-payload-wrappers.yml \
            tooling/vitest/integration/engine-payload-runtime.test.ts
      - name: Remove one-shot helper and publish
        run: |
          git rm .github/workflows/m02-9-minimal-tiptap-lock-once.yml
          git config user.name 'electrocraft-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json packages/media-tiptap .github/workflows/m02-9-engine-payload-wrappers.yml tooling/vitest/integration/engine-payload-runtime.test.ts
          git commit -m 'Lock minimal Tiptap 3.29.2 adapter graph'
          git push origin HEAD:agent/m02-9-engine-payload-wrappers
