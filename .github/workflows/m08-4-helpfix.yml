name: M08.4 Temporary Help Fix

on:
  push:
    branches:
      - codex/m08-4-graphql

permissions:
  contents: write

jobs:
  helpfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/m08-4-graphql
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore canonical HelpRegistry and add GraphQL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path('apps/studio/src/help/help-registry-base.ts')
          target = Path('apps/studio/src/help/help-registry.ts')
          text = base.read_text()
          union_needle = "  | 'help.data.rest'\n"
          text = text.replace(union_needle, union_needle + "  | 'help.data.graphql'\n", 1)
          anchor = "    learnMoreRef: '.ai/microphases/M08_3.md',\n  },\n"
          descriptor = "\n".join([
              "  {",
              "    id: 'help.data.graphql',",
              "    sectionId: 'data-graphql',",
              "    navigationItemId: 'data-sources',",
              "    ...dataSourceKeys,",
              "    relatedIds: ['help.data.sources', 'help.data.rest', 'help.section.queries'],",
              "    keywords: [",
              "      'graphql',",
              "      'introspection',",
              "      'query',",
              "      'mutation',",
              "      'variables',",
              "      'secretref',",
              "      'connectorgateway',",
              "      'cors',",
              "      'schema',",
              "      'endpoint',",
              "    ],",
              "    learnMoreRef: '.ai/microphases/M08_4.md',",
              "  },",
              "",
          ])
          if anchor not in text:
              raise SystemExit('REST help anchor not found')
          text = text.replace(anchor, anchor + descriptor, 1)
          text = text.replace(
              "'data-sources': ['help.data.sources', 'help.data.internal', 'help.data.rest', 'help.section.queries'],",
              "'data-sources': ['help.data.sources', 'help.data.internal', 'help.data.rest', 'help.data.graphql', 'help.section.queries'],",
          )
          target.write_text(text)
          base.unlink()
          PY
      - run: npm run format
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(M08.4): preserve canonical HelpRegistry ownership"
          git push origin HEAD:codex/m08-4-graphql
