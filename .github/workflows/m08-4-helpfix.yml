name: M08.4 Temporary Help Fix

on:
  push:
    branches:
      - codex/m08-4-graphql

permissions:
  contents: write

jobs:
  helpfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/m08-4-graphql
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore canonical HelpRegistry and add GraphQL
        shell: python
        run: |
          from pathlib import Path

          base = Path('apps/studio/src/help/help-registry-base.ts')
          target = Path('apps/studio/src/help/help-registry.ts')
          text = base.read_text()
          text = text.replace("  | 'help.data.rest'\n", "  | 'help.data.rest'\n  | 'help.data.graphql'\n")

          marker = """  {
    id: 'help.data.rest',
    sectionId: 'data-rest',
    navigationItemId: 'data-sources',
    ...dataSourceKeys,
    relatedIds: ['help.data.sources', 'help.data.internal', 'help.section.queries'],
    keywords: [
      'rest api',
      'openapi',
      'swagger',
      'endpoint',
      'secretref',
      'connectorgateway',
      'cors',
      'fetch',
      'operaciones',
      'autenticación',
    ],
    learnMoreRef: '.ai/microphases/M08_3.md',
  },
"""
          addition = marker + """  {
    id: 'help.data.graphql',
    sectionId: 'data-graphql',
    navigationItemId: 'data-sources',
    ...dataSourceKeys,
    relatedIds: ['help.data.sources', 'help.data.rest', 'help.section.queries'],
    keywords: [
      'graphql',
      'introspection',
      'query',
      'mutation',
      'variables',
      'secretref',
      'connectorgateway',
      'cors',
      'schema',
      'endpoint',
    ],
    learnMoreRef: '.ai/microphases/M08_4.md',
  },
"""
          if marker not in text:
              raise SystemExit('REST help marker not found')
          text = text.replace(marker, addition)
          text = text.replace(
              "'data-sources': ['help.data.sources', 'help.data.internal', 'help.data.rest', 'help.section.queries'],",
              "'data-sources': ['help.data.sources', 'help.data.internal', 'help.data.rest', 'help.data.graphql', 'help.section.queries'],",
          )
          target.write_text(text)
          base.unlink()
      - run: npm run format
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(M08.4): preserve canonical HelpRegistry ownership"
          git push origin HEAD:codex/m08-4-graphql
