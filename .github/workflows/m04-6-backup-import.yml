name: M04.6 Import Backup Restore Gate

on:
  pull_request:
    paths:
      - 'packages/application/src/projects/**'
      - 'packages/data-web/**'
      - 'apps/studio/src/features/projects/**'
      - 'apps/studio/src/help/help-registry.ts'
      - 'tooling/vitest/unit/project-backup.test.ts'
      - 'tooling/vitest/integration/project-backup-pglite.test.ts'
      - 'tooling/playwright/m04-6-project-backup.spec.ts'
      - '.github/workflows/m04-6-backup-import.yml'
  push:
    branches:
      - 'codex/m04-6-backup-import-core'

permissions:
  contents: read

concurrency:
  group: m04-6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-import-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify locked toolchain
        run: |
          test "$(node --version)" = 'v22.16.0'
          test "$(npm --version)" = '10.9.2'
          test "$(npm config get legacy-peer-deps)" = 'true'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare reproducible M04.6 formatting candidate
        id: formatting
        run: |
          npx prettier --write \
            packages/application/src/projects \
            packages/data-web \
            apps/studio/src/features/projects \
            apps/studio/src/help/help-registry.ts \
            tooling/vitest/unit/project-backup.test.ts \
            tooling/vitest/integration/project-backup-pglite.test.ts \
            tooling/playwright/m04-6-project-backup.spec.ts \
            .github/workflows/m04-6-backup-import.yml
          git diff > m04-6-format.patch
          git diff --name-only > m04-6-format-files.txt
          if [ -s m04-6-format-files.txt ]; then
            tar -czf m04-6-format-files.tar.gz -T m04-6-format-files.txt
          else
            tar -czf m04-6-format-files.tar.gz --files-from /dev/null
          fi
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Package boundaries
        run: npm run test:boundaries
      - name: M04.6 unit and real PGlite tests
        run: >-
          npx vitest run --config vitest.config.ts
          tooling/vitest/unit/project-backup.test.ts
          tooling/vitest/integration/project-backup-pglite.test.ts
      - name: Full repository tests
        run: npm run test
      - name: Full repository build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: M04.6 browser round-trip
        run: npx playwright test tooling/playwright/m04-6-project-backup.spec.ts --config playwright.config.ts
      - name: Require committed formatting synchronization
        run: test ! -s m04-6-format-files.txt
      - name: Emit M04.6 marker
        if: success()
        run: echo PASS_M04_6_IMPORT_BACKUP_RESTORE | tee m04-6-closure.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m04-6-backup-import-evidence
          path: |
            m04-6-closure.log
            m04-6-format.patch
            m04-6-format-files.txt
            m04-6-format-files.tar.gz
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
