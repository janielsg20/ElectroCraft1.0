openapi: 3.1.0
info:
  title: Product Catalog API
  version: 1.0.0
servers:
  - url: https://api.example.test/v1
security:
  - bearerAuth: []
paths:
  /products:
    get:
      operationId: listProducts
      summary: Listar productos
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
        - name: X-Api-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
    post:
      operationId: createProduct
      summary: Crear producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Created
  /products/{id}:
    get:
      operationId: getProduct
      summary: Obtener producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
